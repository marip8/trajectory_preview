image: docker:git
variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2

services:
    - docker:dind

before_script:
    - apk update && apk add --no-cache wget git openssh-client bash coreutils tar openssh
    - git clone --quiet --depth 1 https://github.com/ros-industrial/industrial_ci .industrial_ci
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

stages:
    - all

clang_format:
    stage: all
    allow_failure: false
    tags:
        - docker-docker
    variables:
        ROS_DISTRO: melodic
        CLANG_FORMAT_VERSION: "3.9"
        CLANG_FORMAT_CHECK: "file"
    script:
        - .industrial_ci/gitlab.sh
    only:
        - merge_requests
        - master

melodic:
    stage: all
    tags:
        - docker-docker
    variables:
        ROS_DISTRO: 'melodic'
        DOCKER_IMAGE: 'ros:melodic'
        UPSTREAM_WORKSPACE: 'dependencies.rosinstall'
        ADDITIONAL_DEBS: 'qt5-default'
    script:
        - .industrial_ci/gitlab.sh
    only:
        - merge_requests
        - master

noetic:
    stage: all
    tags:
        - docker-docker
    variables:
        ROS_DISTRO: 'noetic'
        DOCKER_IMAGE: 'ros:noetic'
        UPSTREAM_WORKSPACE: 'dependencies.rosinstall'
        ADDITIONAL_DEBS: 'qt5-default'
        ROSDEP_SKIP_KEYS: 'cmake_common_scripts'
    script:
        - .industrial_ci/gitlab.sh
    only:
        - merge_requests
        - master
